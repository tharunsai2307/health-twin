version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://healthtwin:healthpass@db:5432/healthtwin
      - JWT_SECRET=production-secure-jwt-secret-replace-me
      - ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=healthtwin
      - POSTGRES_PASSWORD=healthpass
      - POSTGRES_DB=healthtwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtwin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
